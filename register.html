{% extends 'base.html' %}{% block title %}Register · TrustVault{% endblock %}{% block content %}
<section class="auth-card"><div class="eyebrow">GET STARTED</div><h1>Create your account</h1><p>Set up a secure TrustVault account.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name</label><input name="name" maxlength="100" required><label>Email</label><input type="email" name="email" required><label>Password (minimum 10 characters)</label><input type="password" name="password" minlength="10" required><button type="submit">Create account</button></form><p>Already registered? <a href="{{ url_for('home') }}">Sign in</a></p></section>{% endblock %}
