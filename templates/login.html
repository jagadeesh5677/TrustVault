{% extends 'base.html' %}{% block title %}Login · TrustVault{% endblock %}{% block content %}
<section class="auth-card"><div class="eyebrow">PRIVATE DOCUMENT SHARING</div><h1>Welcome to TrustVault</h1><p>Sign in to manage and share documents securely.</p>
<form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email</label><input type="email" name="email" required autocomplete="username"><label>Password</label><input type="password" name="password" required autocomplete="current-password"><button type="submit">Sign in</button></form>
<p>New here? <a href="{{ url_for('register') }}">Create an account</a></p></section>{% endblock %}
